# Tests the bot on every push, then builds "AI Trader.app" on a real Mac and checks it works
# (it opens its window, talks to the bot and shows the demo). On the repo's main (default)
# branch it also publishes the app as the download on the GitHub page:
#   https://github.com/pbelfand-dot/Aistock/releases/latest/download/AITrader-mac.zip
# Nothing is published unless every check passes.
name: Mac app

on:
  push:
    paths: ["trader/**", "mac/**", ".github/workflows/mac-app.yml"]
  workflow_dispatch:

permissions:
  contents: write          # lets this workflow create/update the release

concurrency:
  group: mac-app-${{ github.ref }}     # a newer push to the same branch replaces an older build
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test the bot
        working-directory: trader
        run: |
          pip install -r requirements.txt
          python -m pytest -q

  build:
    needs: test
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build "AI Trader.app"
        run: bash mac/build_app.sh "1.0.${{ github.run_number }}"

      - name: Check the app is a proper Mac app
        run: |
          APP="dist/AI Trader.app"
          archs="$(lipo -archs "$APP/Contents/MacOS/AITrader")"
          echo "architectures: $archs"
          [[ "$archs" == *arm64* && "$archs" == *x86_64* ]]      # Apple Silicon and Intel
          codesign --verify --strict --verbose=2 "$APP"
          plutil -lint "$APP/Contents/Info.plist"
          test -f "$APP/Contents/Resources/AppIcon.icns"

      - name: Self-test (opens the window, talks to the bot, shows the demo)
        timeout-minutes: 10
        run: |
          pip install -r trader/requirements.txt
          AITRADER_HOME="$PWD/trader" AITRADER_PYTHON="$(command -v python)" \
          AITRADER_SCREENSHOT="$PWD/dist/app-screenshot.png" \
            "dist/AI Trader.app/Contents/MacOS/AITrader" --self-test

      - name: First-run test (a brand-new Mac user - install, Setup, then the app on that install)
        timeout-minutes: 15
        run: |
          export HOME="$RUNNER_TEMP/newuser"; rm -rf "$HOME"; mkdir -p "$HOME"
          bash "dist/AI Trader.app/Contents/Resources/install.sh"            # what the app does when it opens
          test -f "$HOME/AITrader/run.py" && test -f "$HOME/AITrader/.env"
          # The Setup menu's first run: gets uv, installs Python 3.12 and the libraries, then shows the menu.
          echo q | TERM=dumb bash "$HOME/AITrader/AI Trader Menu.command"
          cmp "$HOME/AITrader/requirements.txt" "$HOME/AITrader/.venv/.installed-requirements"
          AITRADER_HOME="$HOME/AITrader" AITRADER_SCREENSHOT="$RUNNER_TEMP/first-run.png" \
            "dist/AI Trader.app/Contents/MacOS/AITrader" --self-test

      - name: Update test (an older copy updates itself to this build; a tampered download is refused)
        timeout-minutes: 5
        run: |
          T="$RUNNER_TEMP/update-test"; rm -rf "$T"; mkdir -p "$T"
          OLD="$T/AI Trader.app"
          cp -R "dist/AI Trader.app" "$OLD"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.0" -c "Set :CFBundleVersion 1.0.0" "$OLD/Contents/Info.plist"
          codesign --force --sign - "$OLD"
          version() { /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$1/Contents/Info.plist"; }
          export AITRADER_HOME="$PWD/trader" AITRADER_PYTHON="$(command -v python)"
          cp dist/AITrader-mac.zip "$T/"
          sed 's/"sha256": "[0-9a-f]*"/"sha256": "0000"/' dist/latest.json > "$T/tampered.json"
          if AITRADER_UPDATE_FEED="file://$T/tampered.json" "$OLD/Contents/MacOS/AITrader" --update-test; then
            echo "A download that didn't match its fingerprint was installed"; exit 1
          fi
          test "$(version "$OLD")" = "1.0.0"
          AITRADER_UPDATE_FEED="file://$PWD/dist/latest.json" "$OLD/Contents/MacOS/AITrader" --update-test
          test "$(version "$OLD")" = "1.0.${{ github.run_number }}"
          codesign --verify --strict "$OLD"
          ls -a "$T"

      - name: Keep the self-test screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-screenshot
          path: dist/app-screenshot.png
          if-no-files-found: ignore

      - name: Publish the download (main branch only)
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes="Version 1.0.${{ github.run_number }}, built from ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}.
          Download AITrader-mac.zip, unzip it, drag AI Trader into Applications, then follow the first-open steps in the README."
          if gh release view mac-app >/dev/null 2>&1; then
            gh release edit mac-app --title "AI Trader for Mac" --notes "$notes" --latest
          else
            gh release create mac-app --target "$GITHUB_SHA" --title "AI Trader for Mac" --notes "$notes" --latest
          fi
          gh release upload mac-app dist/AITrader-mac.zip dist/app-screenshot.png --clobber
          gh release upload mac-app dist/latest.json --clobber      # last: the apps' updater reads this
