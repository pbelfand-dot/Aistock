# =====================================================================
#  AI TRADER SETTINGS
#  Every "knob" of the bot lives here. Secrets (Schwab keys) go in .env,
#  never in this file.
# =====================================================================

# ---- What the bot watches and trades --------------------------------
# Keep this list SHORT while learning. Whole shares only (Schwab's API
# can't buy fractional shares), so very expensive stocks may be skipped
# on a small account.
watchlist: [SPY, QQQ, IWM, XLF, XLE, XLK, AAPL, MSFT, AMD, JPM, KO, BAC]

# The yardstick. If the bot can't beat simply holding this, it's not
# worth running.
benchmark: SPY

# ---- Market data -----------------------------------------------------
data:
  # "yfinance" = free Yahoo data, works today with no account.
  # "schwab"   = Schwab's own data (use once your developer app is approved).
  source: yfinance
  history_years: 8         # how much history the AI learns from
  cache_minutes: 30        # re-use downloaded prices for this long

# ---- Phase 1: STUDY (watch & learn, no trades) ----------------------
study:
  min_calendar_days: 30    # "a month of analyzing"
  min_study_days: 20       # ...and at least this many trading days recorded
  horizon_days: 5          # each opinion is graded 5 trading days later

# ---- The local AI model ---------------------------------------------
ai:
  buy_above: 0.56          # AI must be >= 56% sure the price rises to buy
  sell_below: 0.48         # ...and sells when it drops below 48%
  retrain_every_days: 21   # re-learn about once a month
  min_train_days: 500      # don't trust the AI until it has ~2 years to learn from

# ---- How a trading plan gets picked after the study month ------------
plan:
  min_sharpe: 0.5          # risk-adjusted return in the backtest
  min_profit_factor: 1.15  # $ won / $ lost on closed trades
  max_drawdown_pct: 25     # worst peak-to-bottom drop allowed in the backtest
  min_trades: 30           # need enough trades for the numbers to mean anything
  min_forward_signals: 10  # need this many graded "buy" opinions from the study month

# ---- Phase 3: PAPER (fake money, real prices) ------------------------
paper:
  starting_cash: 2000      # keep EQUAL to live.max_capital so paper results are realistic
  slippage_pct: 0.05       # assume we fill a bit worse than the quoted price
  commission_per_trade: 0.0

# ---- Rules to go from PAPER -> LIVE ("once you're profitable") -------
# ALL must pass, and you must still confirm by hand.
promotion:
  min_trading_days: 30
  min_closed_trades: 20
  min_total_return_pct: 0.0
  min_profit_factor: 1.2
  max_drawdown_pct: 10
  must_beat_benchmark: true

# ---- Risk rules (used in backtest, paper AND live) -------------------
risk:
  max_open_positions: 5
  max_position_pct: 20       # no single stock > 20% of the account
  stop_loss_pct: 7           # sell if a position falls 7% below what we paid
  daily_loss_limit_pct: 3    # down 3% today -> no new buys today
  max_drawdown_pct: 15       # down 15% from the best day -> KILL SWITCH
  cash_buffer_pct: 1         # always leave a little cash

# ---- Phase 4: LIVE (real money through Schwab) ----------------------
live:
  max_capital: 2000          # the bot will NEVER use more than this, even if the account has more
  account_type: cash         # "cash" or "margin" (cash = can't spend unsettled sale money)
  limit_buffer_pct: 0.2      # limit orders at quote +/- 0.2% so they fill but never at crazy prices
  fill_timeout_seconds: 60   # cancel an order if it isn't filled in time

# ---- Optional local LLM (Ollama) for plain-English write-ups ---------
# It WRITES the plan and journal. It does NOT decide trades.
llm:
  enabled: true
  url: http://localhost:11434
  model: qwen3:4b            # small enough for a normal laptop (~2.5 GB)
  timeout_seconds: 180
